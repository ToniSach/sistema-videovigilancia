# ============================================================================
# Despliegue del NVR con Docker — compatible con WINDOWS (Docker Desktop) y Linux.
#
#   docker compose up -d --build
#
# Servicios:
#   - db       → PostgreSQL (persistente en el volumen pgdata).
#   - backend  → API REST/WebSocket + go2rtc (capa de medios) + IA + grabación.
#
# RED EN MODO BRIDGE (puertos publicados)
# ---------------------------------------
# A diferencia de host-networking (que SOLO existe en Linux), aquí se publican
# los puertos al host, así que funciona igual en Windows y en Linux:
#   - El contenedor alcanza las cámaras IP de la LAN por NAT de salida.
#   - Los clientes (escritorio/móvil) llegan a los puertos publicados del host.
#   - Para WebRTC, define HOST_LAN_IP en .env.docker con la IP LAN del PC para
#     que go2rtc anuncie un candidato ICE alcanzable. (HLS/RTSP no lo necesitan.)
#
# El cliente de escritorio (PySide6) y la app móvil NO van aquí: se ejecutan en
# los equipos de los usuarios y apuntan a la IP de este servidor.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: nvr_db
    restart: unless-stopped
    # POSTGRES_DB/USER/PASSWORD se leen de .env.docker (mismo origen que el
    # backend, para que las credenciales COINCIDAN). No usamos un bloque
    # `environment: ${...}` porque eso lo resolvería Compose desde el .env del
    # repo (distinto de .env.docker) y la contraseña de la BD no cuadraría.
    env_file:
      - .env.docker
    # Solo expuesto a localhost del host (para pgAdmin/depuración); el backend
    # lo alcanza por el nombre de servicio "db" en la red interna.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nvrnet
    healthcheck:
      # $$ → el shell del contenedor expande la variable (de .env.docker),
      # no Compose. Así coincide con las credenciales reales del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nvr-backend:latest
    container_name: nvr_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # En bridge, la BD se alcanza por el nombre del servicio.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      GO2RTC_ENABLED: "true"
      # IP LAN del PC anfitrión (para candidatos WebRTC). HLS/RTSP no la necesitan.
      GO2RTC_PUBLIC_HOST: ${HOST_LAN_IP:-}
      RECORDINGS_PATH: /data/recordings
      AI_MODEL: /data/models/yolov8n.pt
    ports:
      - "5000:5000"      # API REST + WebSocket
      - "1984:1984"      # go2rtc (HLS / panel)
      - "8554:8554"      # RTSP restream (directo escritorio)
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC (ICE)
    volumes:
      - ./data/recordings:/data/recordings   # grabaciones + snapshots
      - ./data/models:/data/models           # modelos YOLO (persistentes)
    networks:
      - nvrnet
    depends_on:
      db:
        condition: service_healthy

networks:
  nvrnet:
    driver: bridge

volumes:
  pgdata:
