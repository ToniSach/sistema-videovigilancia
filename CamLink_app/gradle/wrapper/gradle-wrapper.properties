#Thu Apr 09 16:54:19 CST 2026
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.9 es la versión recomendada para AGP 8.7.x. Si subes AGP a 8.8 más
# adelante, sube también a Gradle 8.10.2 mínimo.
# Quitamos distributionSha256Sum porque al cambiar la URL el checksum del
# bundle viejo (9.3.1) ya no coincide; Gradle lo verifica online via HTTPS.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
